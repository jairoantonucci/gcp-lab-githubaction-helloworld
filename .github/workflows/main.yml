name: Teste de Conexao GCP
on: [push]

jobs:
  check-auth:
    runs-on: ubuntu-latest
    permissions:
      id-token: 'write' # Isso permite que o GitHub peça um token ao Google
      contents: 'read'
    steps:
      - uses: actions/checkout@v4

      - name: Autenticando no Google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Teste de Comando GCloud
        run: gcloud auth list # Se isso listar a Service Account, funcionou!